<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comentários</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    #comments { margin: 20px 0; }
    .comment { border-bottom: 1px solid #ddd; padding: 12px 0; }
    .comment p { margin: 0; }
    .comment small { color: #666; }
    form { display: flex; gap: 8px; margin-top: 20px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 16px; }
    #erro { color: red; margin-top: 10px; }
  </style>
</head>

<body>

  <h1>Comentários do Post #42</h1>

  <div id="comments">Carregando...</div>

  <form id="form-comment">
    <input 
      type="text" 
      id="input-texto" 
      placeholder="Escreva um comentário..." 
      maxlength="500"
      required
    >
    <button type="submit">Enviar</button>
  </form>
  
  <div id="erro"></div>

<script>
const API = 'https://seu-projeto.supabase.co/functions/v1/proxy-supabase'
const POST_ID = 42 // Troca pro ID do seu post

const commentsDiv = document.getElementById('comments')
const form = document.getElementById('form-comment')
const input = document.getElementById('input-texto')
const erroDiv = document.getElementById('erro')

// Chama a Edge Function
async function callApi(action, payload) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, payload })
  })

  const result = await res.json()
  if (!res.ok) throw new Error(result.error || 'Erro na requisição')
  return result.data
}

// Renderiza comentários na tela
function renderComments(comentarios) {
  if (!comentarios.length) {
    commentsDiv.innerHTML = '<p>Nenhum comentário ainda.</p>'
    return
  }
  
  commentsDiv.innerHTML = comentarios.map(c => `
    <div class="comment">
      <p>${c.texto}</p>
      <small>${new Date(c.created_at).toLocaleString('pt-BR')}</small>
    </div>
  `).join('')
}
  // Carrega comentários ao abrir a página
async function carregarComentarios() {
  try {
    erroDiv.textContent = ''
    const comentarios = await callApi('list-comments', { post_id: POST_ID })
    renderComments(comentarios)
  } catch (e) {
    commentsDiv.innerHTML = '<p>Erro ao carregar comentários.</p>'
    erroDiv.textContent = e.message
  }
}
  // Envia novo comentário
form.addEventListener('submit', async (e) => {
  e.preventDefault()
  const texto = input.value.trim()
  if (!texto) return

  try {
    erroDiv.textContent = ''
    input.disabled = true
    await callApi('add-comment', { post_id: POST_ID, texto })
    input.value = ''
    await carregarComentarios() // Recarrega a lista
  } catch (e) {
    erroDiv.textContent = e.message
  } finally {
    input.disabled = false
  }
})
  // Inicia
carregarComentarios()
</script>

</body>
</html>
